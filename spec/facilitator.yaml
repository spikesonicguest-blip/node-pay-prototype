openapi: 3.0.3
info:
  title: "Facilitator API"
  version: "v1"
  summary: "Defines the Facilitator's API for verifying and settling x402 payments."
paths:
  /v1/verify:
    post:
      summary: Verify Payment Authorization
      description: |
        Verifies a payment authorization without executing the transaction on the blockchain.
        Checks signature, balance, and constraints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'

  /v1/settle:
    post:
      summary: Settle Payment
      description: |
        Executes a verified payment by broadcasting the transaction to the blockchain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Settlement result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResponse'

  /v1/supported:
    get:
      summary: Get Supported Capabilities
      description: |
        Returns the list of payment schemes, networks, and extensions supported by the facilitator.
      responses:
        '200':
          description: Supported capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedResponse'

  # NodePay Managed Mode Endpoints (Optional additions to core x402)
  /v1/charges:
    post:
      summary: Create a Charge (Managed Mode)
      description: |
        Creates a new charge for managed payment flows where the facilitator tracks state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './charges.yaml#/components/schemas/CreateChargeRequest'
      responses:
        '200':
          description: Charge created
          content:
            application/json:
              schema:
                $ref: './charges.yaml#/components/schemas/Charge'
  /v1/charges/{id}:
    get:
      summary: Retrieve a Charge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Charge retrieved
          content:
            application/json:
              schema:
                $ref: './charges.yaml#/components/schemas/Charge'

components:
  schemas:
    VerifyRequest:
      type: object
      required:
        - paymentPayload
        - paymentRequirements
      properties:
        paymentPayload:
          $ref: './x402_protocol.yaml#/components/schemas/PaymentPayload'
        paymentRequirements:
          $ref: './x402_protocol.yaml#/components/schemas/PaymentRequirements'

    VerifyResponse:
      type: object
      required:
        - isValid
      properties:
        isValid:
          type: boolean
        invalidReason:
          type: string
        payer:
          type: string

    SettleResponse:
      type: object
      required:
        - success
        - transaction
        - network
      properties:
        success:
          type: boolean
        errorReason:
          type: string
        payer:
          type: string
        transaction:
          type: string
          description: "Blockchain transaction hash."
        network:
          type: string
          description: "CAIP-2 network identifier."

    SupportedResponse:
      type: object
      required:
        - kinds
        - extensions
        - signers
      properties:
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/SupportedKind'
        extensions:
          type: array
          items:
            type: string
        signers:
          type: object
          description: "Map of CAIP-2 patterns to signer addresses."
          additionalProperties:
            type: array
            items:
              type: string

    SupportedKind:
      type: object
      required:
        - x402Version
        - scheme
        - network
      properties:
        x402Version:
          type: integer
          example: 2
        scheme:
          type: string
          example: "exact"
        network:
          type: string
          example: "eip155:84532"
        extra:
          type: object
